name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/prepare_release_notes.py --output "$RUNNER_TEMP/release-notes.md"
          VERSION=$(python -c 'import json; print(json.load(open("plugins/student-presentation-suite/.claude-plugin/plugin.json"))["version"])')
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION — Verified production pipeline" --notes-file "$RUNNER_TEMP/release-notes.md"
