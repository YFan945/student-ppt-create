name: v071-release-prep

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'chore prepare v0.7.1 release candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ppt-generation-core-v0.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update release docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          zh = Path('README-zh.md')
          text = zh.read_text(encoding='utf-8')
          text = text.replace(
              '<topic>-presentation-package-report.json\n<topic>-delivery-report.json\n',
              '<topic>-presentation-package-report.json\n<topic>-actual-content-report.json\n<topic>-visual-review.json\n<topic>-quality-report.json\n<topic>-delivery-report.json\n',
              1,
          )
          text = text.replace('<topic>-quality-report.json\n<topic>-revision-manifest.json\n', '<topic>-revision-manifest.json\n', 1)
          old_zh = '''最终回复会说明文件绝对路径、页数、渲染检查结果，以及任务状态：\n`complete`、`incomplete` 或 `blocked`。默认只有三道门禁：一次 Slide Spec/Brief 校验；\n最终 PPTX 的 package validation、完整渲染与逐页查看；一次绑定当前 PPTX、规划报告和预览的\n简化 delivery check。content/asset/visual/QA manifest 仅作为高级诊断，不再是普通交付物。\n`deck.js` 遵守官方 PptxGenJS gotchas，并默认根据叙事任务和可用素材自由构图；helper\n负责安全检查，版式、visual、shape、SVG 和 composer 库仅提供可选灵感与确定性兜底。\nwrapper 只做 normalize 后原子落盘，不做生成期静态\n门禁，布局/溢出问题由 QA 逐页视觉检查与 package validation 发现。\nQA 和 delivery 复用 package report，不重复校验未修改的 deck。\n'''
          new_zh = '''最终回复会说明文件绝对路径、页数、渲染检查结果，以及任务状态：\n`complete`、`incomplete` 或 `blocked`。v0.7.1 默认质量链分为四段：① Slide Spec/Brief\n校验后冻结计划；② Actual Element Registry + package validation + PPTX artifact readback\n检查真实文件是否与冻结计划一致；③ 完整渲染后生成结构化 visual review，并执行页面视觉评分、\ndeck-level 节奏、Evidence Closure 与 speaker timing quality gate；④ delivery report 将这些证据\n与当前 PPTX/Slide Spec/spec lock 哈希绑定后才能进入 `complete`。旧 content/asset/QA manifest\n仍只作为高级诊断。\n`deck.js` 继续采用 adaptive-freeform PptxGenJS：模型负责表达、视觉焦点和构图语言，Actual\nElement Registry 负责真实元素的越界/重叠/文字适配底线；版式、visual、shape、SVG 和 composer\n库只提供灵感或确定性兜底。Render QA 不再以“没有 overflow/overlap”作为审美通过标准：\nHigh-score 页面还要检查 hierarchy、focal point、composition、visual interest、whitespace、\nAI-template feel 和整套页面结构重复。QA 和 delivery 复用未变化的 package/readback 证据。\n'''
          if old_zh not in text:
              raise SystemExit('README-zh old QA paragraph not found')
          zh.write_text(text.replace(old_zh, new_zh, 1), encoding='utf-8')

          en = Path('README.md')
          text = en.read_text(encoding='utf-8')
          text = text.replace(
              '<topic>-presentation-package-report.json\n<topic>-delivery-report.json\n',
              '<topic>-presentation-package-report.json\n<topic>-actual-content-report.json\n<topic>-visual-review.json\n<topic>-quality-report.json\n<topic>-delivery-report.json\n',
              1,
          )
          text = text.replace('<topic>-quality-report.json\n<topic>-revision-manifest.json\n', '<topic>-revision-manifest.json\n', 1)
          old_en = '''The final response reports each absolute file path, slide count, rendered QA\nresult, and the status: `complete`, `incomplete`, or `blocked`. A `complete`\ndelivery uses three gates: one validated Slide Spec report, package validation plus full rendering\nand page review, and one simplified delivery report bound to the current PPTX and previews.\nDetailed content/asset/visual manifests remain optional diagnostics.\n`deck.js` follows the official PptxGenJS gotchas and composes slides freely from their\nnarrative job and available assets. Suite-owned layout, visual, shape, SVG, and composer\nlibraries provide optional inspiration and deterministic fallback; the wrapper\nnormalizes and atomically publishes the deck, and layout/overflow quality is\ncaught by page review and package validation. Delivery reuses the\npackage report instead of revalidating an unchanged deck.\n'''
          new_en = '''The final response reports each absolute file path, slide count, rendered QA\nresult, and the status: `complete`, `incomplete`, or `blocked`. v0.7.1 uses four quality stages:\n(1) validate and freeze the Slide Spec; (2) run the Actual Element Registry, package validation,\nand PPTX artifact readback against that frozen plan; (3) render every page, write a structured\nvisual review, and run visual-score, deck-rhythm, evidence-closure, and speaker-timing gates;\n(4) bind those reports to the current PPTX, Slide Spec, and spec-lock hashes in the delivery report.\nLegacy content/asset/QA manifests remain optional advanced diagnostics.\n`deck.js` remains adaptive-freeform PptxGenJS: the model chooses expression, focal point, and\ncomposition language, while the Actual Element Registry enforces real-element geometry/text-fit\nbaselines. Suite-owned layout, visual, shape, SVG, and composer libraries remain inspiration or\ndeterministic fallback. Render QA no longer treats “no overflow/overlap” as sufficient design\nquality: high-score decks also evaluate hierarchy, focal point, composition, visual interest,\nwhitespace, AI-template feel, and repeated structures across the deck.\n'''
          if old_en not in text:
              raise SystemExit('README old QA paragraph not found')
          en.write_text(text.replace(old_en, new_en, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          entry = '''## Unreleased\n\n### v0.7.1：冻结计划与设计质量闭环\n\n- Slide Spec 校验后生成 `slide-spec-lock.json` 并绑定 SHA-256；生产、readback 与 QA 阶段禁止\n  静默修改计划。确需改计划时必须重新校验并显式 `revise --reason`，记录 parent spec hash。\n- 新增结构化 render visual critic：逐页记录 hierarchy、focal point、composition、visual interest、\n  whitespace、visual structure 与 AI-template feel；High-score 单项低于 6 或整套均分低于 7 阻断。\n- 新增 deck-level rhythm gate：连续两页等权卡片/卡片网格/三等分/普通编号列表即 Major，\n  任意页面结构连续三页或整套结构多样性不足也会触发返工。\n- 新增 Evidence Closure 与 speaker timing：`evidence_refs`、Evidence Ledger、页面短引用和最终\n  References 必须闭环；讲稿按中文约 240 字/分钟、英文约 130 词/分钟估时，整体超时 15% 阻断。\n- v0.7.1 delivery 与 `workflow_guard complete` 绑定 actual-content、quality report、冻结 Slide Spec\n  与 spec-lock hash，旧 simplified delivery 不能绕过新 quality gate。\n- Typography grammar 增加 thesis contrast、oversized keyword、one-claim-three-supports、\n  question→answer 等表达语法，明确禁止把并列 bullet 机械换成 01/02/03/04 或 N 个等宽矩形。\n\n'''
          if marker not in text:
              raise SystemExit('CHANGELOG Unreleased marker not found')
          changelog.write_text(text.replace(marker, entry, 1), encoding='utf-8')
          PY
      - name: Bump plugin version
        shell: bash
        run: python plugins/student-presentation-suite/scripts/bump_version.py 0.7.1
      - name: Commit release candidate metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README-zh.md CHANGELOG.md .claude-plugin/marketplace.json plugins/student-presentation-suite/.claude-plugin/plugin.json plugins/student-presentation-suite/package.json plugins/student-presentation-suite/package-lock.json plugins/student-presentation-suite/skills/*/SKILL.md
          if ! git diff --cached --quiet; then
            git commit -m "chore prepare v0.7.1 release candidate"
            git push origin HEAD:improve/ppt-generation-core-v0.7
          fi
