name: v08-maintenance

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]
    paths:
      - .github/workflows/v08-maintenance.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ppt-generation-core-v0.7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install node dependencies
        run: npm --prefix plugins/student-presentation-suite ci
      - name: Synchronize version and formatting
        run: |
          python plugins/student-presentation-suite/scripts/bump_version.py 0.8.0
          npx --prefix plugins/student-presentation-suite prettier --write plugins/student-presentation-suite/scripts/composition_wireframe.js
      - name: Commit maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json \
            plugins/student-presentation-suite/.claude-plugin/plugin.json \
            plugins/student-presentation-suite/package.json \
            plugins/student-presentation-suite/package-lock.json \
            plugins/student-presentation-suite/skills/sp-deck/SKILL.md \
            plugins/student-presentation-suite/skills/sp-outline/SKILL.md \
            plugins/student-presentation-suite/skills/sp-review/SKILL.md \
            plugins/student-presentation-suite/scripts/composition_wireframe.js
          if git diff --cached --quiet; then
            echo "No maintenance changes needed."
            exit 0
          fi
          git commit -m "chore: synchronize v0.8 version and formatting"
          git push origin HEAD:improve/ppt-generation-core-v0.7
