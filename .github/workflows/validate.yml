name: validate

on:
  push:
    branches: [claude-code, improve/ppt-generation-core-v0.7]
  pull_request:
    branches: [claude-code]

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r plugins/student-presentation-suite/requirements.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt
          python -m pip install ruff
          npm --prefix plugins/student-presentation-suite ci
      - name: Validate schema and tests
        shell: pwsh
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m json.tool plugins/student-presentation-suite/references/slide-spec.schema.json | Out-Null
          python -m json.tool plugins/student-presentation-suite/references/presentation-brief.schema.json | Out-Null
          python -m unittest discover -s plugins/student-presentation-suite/tests
          node plugins/student-presentation-suite/scripts/run_with_pptxgenjs.js --probe
      - name: Smoke test (Windows package/runtime path; rendering covered by Ubuntu matrix)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: python plugins/student-presentation-suite/scripts/smoke_pptx.py --skip-render --json
      - name: Lint Python (ruff)
        shell: pwsh
        run: |
          ruff check plugins/student-presentation-suite/shared/ plugins/student-presentation-suite/scripts/ plugins/student-presentation-suite/tests/
      - name: Lint JavaScript (eslint + prettier)
        shell: pwsh
        run: |
          npx --prefix plugins/student-presentation-suite eslint plugins/student-presentation-suite/scripts/*.js
          npx --prefix plugins/student-presentation-suite prettier --check plugins/student-presentation-suite/scripts/*.js

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          python -m pip install -r plugins/student-presentation-suite/requirements.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt
          npm --prefix plugins/student-presentation-suite ci
      - name: Release checks
        shell: pwsh
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
          PYTHONIOENCODING: "utf-8"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git diff --check
          python plugins/student-presentation-suite/scripts/check_plugin_release.py
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -eq "claude-code") {
            python scripts/check_marketplace_release.py
          } else {
            Write-Host "Skipping marketplace release-branch gate outside a direct claude-code push."
          }
          python plugins/student-presentation-suite/scripts/check_claude_pptx_env.py --mode all --json --strict

  claude-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Strict Claude validation
        run: |
          claude plugin validate --strict ./plugins/student-presentation-suite
          claude plugin validate --strict .

  render-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          python -m pip install -r plugins/student-presentation-suite/requirements.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt
          npm --prefix plugins/student-presentation-suite ci
      - name: Render scenario matrix
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
          PPTX_RUNTIME_FORCE_AF_UNIX_SHIM: "1"
        run: python plugins/student-presentation-suite/scripts/scenario_render_matrix.py --require-render
      - name: Render visual system galleries
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
        run: python plugins/student-presentation-suite/scripts/visual_system_smoke_gallery.py --gallery all --require-render

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        run: |
          python -m pip install -r plugins/student-presentation-suite/requirements.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt
          npm --prefix plugins/student-presentation-suite ci
      - name: Pip audit
        run: |
          python -m pip install pip-audit
          pip-audit -r plugins/student-presentation-suite/requirements.txt -r plugins/student-presentation-suite/requirements-claude-pptx.txt
      - name: Npm audit policy gate
        run: python plugins/student-presentation-suite/scripts/npm_audit_gate.py --json
      - name: NuGet audit
        run: |
          dotnet restore plugins/student-presentation-suite/shared/pptx_runtime/openxml_validator/OpenXmlValidator.csproj --locked-mode
          dotnet list plugins/student-presentation-suite/shared/pptx_runtime/openxml_validator/OpenXmlValidator.csproj package --vulnerable --include-transitive
