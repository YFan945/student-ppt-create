name: validate

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Consecutive pushes to the same branch supersede each other's validation run
# (e.g. a batch series landing one commit at a time): only the newest run needs
# to finish, so cancel the superseded ones instead of paying for all of them.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Lint is platform- and interpreter-independent: run it ONCE instead of in
    # all four runtime matrix cells.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "plugins/student-presentation-suite/requirements*.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/student-presentation-suite/package-lock.json
      - name: Install lint dependencies
        run: |
          python -m pip install ruff==0.16.7
          npm --prefix plugins/student-presentation-suite ci
      - name: Lint Python (ruff)
        run: |
          ruff check plugins/student-presentation-suite/shared/ plugins/student-presentation-suite/scripts/ plugins/student-presentation-suite/skills/ plugins/student-presentation-suite/tests/
      - name: Lint JavaScript (eslint + prettier)
        run: |
          npx --prefix plugins/student-presentation-suite eslint --config plugins/student-presentation-suite/eslint.config.mjs plugins/student-presentation-suite/scripts/*.js
          npx --prefix plugins/student-presentation-suite prettier --check plugins/student-presentation-suite/scripts/*.js

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "plugins/student-presentation-suite/requirements*.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/student-presentation-suite/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r plugins/student-presentation-suite/requirements.txt -c plugins/student-presentation-suite/python-constraints.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt -c plugins/student-presentation-suite/python-constraints.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix plugins/student-presentation-suite ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate schema and tests
        shell: pwsh
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
          PYTHONIOENCODING: "utf-8"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $schemas = @(
            "slide-spec.schema.json",
            "presentation-brief.schema.json",
            "image-sources.schema.json",
            "asset-manifest.schema.json",
            "research-pack.schema.json",
            "evidence-map.schema.json",
            "visual-review.schema.json"
          )
          foreach ($schema in $schemas) {
            python -m json.tool "plugins/student-presentation-suite/references/$schema" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m unittest discover -s plugins/student-presentation-suite/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node plugins/student-presentation-suite/scripts/run_with_pptxgenjs.js --probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test (Windows package/runtime path; rendering covered by Ubuntu matrix)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: python plugins/student-presentation-suite/scripts/smoke_pptx.py --skip-render --json

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "plugins/student-presentation-suite/requirements*.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/student-presentation-suite/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          python -m pip install -r plugins/student-presentation-suite/requirements.txt -c plugins/student-presentation-suite/python-constraints.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt -c plugins/student-presentation-suite/python-constraints.txt
          npm --prefix plugins/student-presentation-suite ci
      - name: Release checks
        shell: pwsh
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
          PYTHONIOENCODING: "utf-8"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python plugins/student-presentation-suite/scripts/check_plugin_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -eq "main") {
            python scripts/check_marketplace_release.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Skipping marketplace release-branch gate outside a direct main push."
          }
          python plugins/student-presentation-suite/scripts/check_claude_pptx_env.py --mode all --json --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  claude-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/student-presentation-suite/package-lock.json
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.272
      - name: Strict Claude validation
        run: |
          claude plugin validate --strict ./plugins/student-presentation-suite
          claude plugin validate --strict .

  render-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "plugins/student-presentation-suite/requirements*.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/student-presentation-suite/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          python -m pip install -r plugins/student-presentation-suite/requirements.txt -c plugins/student-presentation-suite/python-constraints.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt -c plugins/student-presentation-suite/python-constraints.txt
          npm --prefix plugins/student-presentation-suite ci
      - name: Render scenario matrix
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
          PPTX_RUNTIME_FORCE_AF_UNIX_SHIM: "1"
        run: python plugins/student-presentation-suite/scripts/scenario_render_matrix.py --require-render
      - name: Render visual system galleries
        env:
          PYTHONPATH: "${{ github.workspace }}/plugins/student-presentation-suite"
        run: python plugins/student-presentation-suite/scripts/visual_system_smoke_gallery.py --gallery all --require-render

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "plugins/student-presentation-suite/requirements*.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/student-presentation-suite/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        run: |
          python -m pip install -r plugins/student-presentation-suite/requirements.txt -c plugins/student-presentation-suite/python-constraints.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt -c plugins/student-presentation-suite/python-constraints.txt
          npm --prefix plugins/student-presentation-suite ci
      - name: Pip audit
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r plugins/student-presentation-suite/python-constraints.txt
      - name: Npm audit policy gate
        run: python plugins/student-presentation-suite/scripts/npm_audit_gate.py --json
      - name: NuGet audit
        run: |
          dotnet restore plugins/student-presentation-suite/shared/pptx_runtime/openxml_validator/OpenXmlValidator.csproj --locked-mode
          dotnet list plugins/student-presentation-suite/shared/pptx_runtime/openxml_validator/OpenXmlValidator.csproj package --vulnerable --include-transitive

  release-ready:
    if: always()
    needs: [lint, runtime, release-checks, claude-manifest, render-matrix, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); assert all(j["result"] == "success" for j in jobs.values()), jobs'
