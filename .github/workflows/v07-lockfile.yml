name: v07-lockfile

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message != 'chore: refresh v0.7 npm lockfile' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh lockfile
        run: npm --prefix plugins/student-presentation-suite install --package-lock-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/student-presentation-suite/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: refresh v0.7 npm lockfile"
            git push origin HEAD:improve/ppt-generation-core-v0.7
          fi
