name: repo-cleanup-once

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]
    paths: [.github/workflows/repo-cleanup-once.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ppt-generation-core-v0.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix npm audit dependency and simplify workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('plugins/student-presentation-suite/package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data.setdefault('overrides', {})['js-yaml'] = '4.3.2'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validate = Path('.github/workflows/validate.yml')
          text = validate.read_text(encoding='utf-8')
          text = text.replace(
              'branches: [claude-code, improve/ppt-generation-core-v0.7]',
              'branches: [main, improve/ppt-generation-core-v0.7]',
          )
          text = text.replace('branches: [claude-code]', 'branches: [main]')
          validate.write_text(text, encoding='utf-8')
          PY
          npm --prefix plugins/student-presentation-suite install --package-lock-only --ignore-scripts
          rm -f .github/dependabot.yml
          rm -f .github/workflows/v08-maintenance.yml
          rm -f .github/workflows/v08-finalize.yml
          rm -f .github/workflows/repo-cleanup-once.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: simplify branches and fix CI dependency'
          git push origin HEAD:improve/ppt-generation-core-v0.7
      - name: Delete stale branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'dependabot/github_actions/actions/checkout-7'
            'dependabot/github_actions/actions/setup-dotnet-6'
            'dependabot/github_actions/actions/setup-node-7'
            'dependabot/github_actions/actions/setup-python-7'
            'dependabot/npm_and_yarn/plugins/student-presentation-suite/eslint-10.10.0'
            'dependabot/npm_and_yarn/plugins/student-presentation-suite/image-size-2.0.2'
            'dependabot/npm_and_yarn/plugins/student-presentation-suite/prettier-3.9.6'
            'dependabot/pip/plugins/student-presentation-suite/jsonschema-gte-4.26.0'
            'dependabot/pip/plugins/student-presentation-suite/markitdown-gte-0.1.7-and-lt-1.0'
            'dependabot/pip/plugins/student-presentation-suite/pillow-gte-12.3.0'
            'dependabot/pip/plugins/student-presentation-suite/pyyaml-gte-6.0.3'
            'improve-ppt-generation-loop'
            'improve-ppt-generation-v0.7'
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch" || true
          done
