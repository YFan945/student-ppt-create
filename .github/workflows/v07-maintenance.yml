name: v07-maintenance

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]

permissions:
  contents: write

jobs:
  normalize:
    if: "${{ github.event.head_commit.message != 'chore: normalize v0.7 generated metadata' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies
        run: npm --prefix plugins/student-presentation-suite ci
      - name: Normalize version and formatting
        run: |
          python plugins/student-presentation-suite/scripts/bump_version.py 0.7.0
          npx --prefix plugins/student-presentation-suite prettier --write plugins/student-presentation-suite/scripts/pptx-element-registry.js
      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json \
            plugins/student-presentation-suite/.claude-plugin/plugin.json \
            plugins/student-presentation-suite/package.json \
            plugins/student-presentation-suite/package-lock.json \
            plugins/student-presentation-suite/skills/sp-outline/SKILL.md \
            plugins/student-presentation-suite/skills/sp-deck/SKILL.md \
            plugins/student-presentation-suite/skills/sp-review/SKILL.md \
            plugins/student-presentation-suite/scripts/pptx-element-registry.js
          if git diff --cached --quiet; then
            echo "Nothing to normalize."
          else
            git commit -m "chore: normalize v0.7 generated metadata"
            git push origin HEAD:improve/ppt-generation-core-v0.7
          fi
