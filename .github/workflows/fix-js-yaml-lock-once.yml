name: fix-js-yaml-lock-once

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]
    paths:
      - .github/workflows/fix-js-yaml-lock-once.yml

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ppt-generation-core-v0.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update js-yaml override and lockfile
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'plugins/student-presentation-suite/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides ||= {};
          pkg.overrides['js-yaml'] = '4.3.2';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm --prefix plugins/student-presentation-suite install --package-lock-only --ignore-scripts
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-js-yaml-lock-once.yml
          git add plugins/student-presentation-suite/package.json plugins/student-presentation-suite/package-lock.json
          git commit -m "fix: update js-yaml security override to 4.3.2"
          git push origin HEAD:improve/ppt-generation-core-v0.7
