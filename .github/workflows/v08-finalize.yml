name: v08-finalize

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]
    paths:
      - .github/workflows/v08-finalize.yml

permissions:
  contents: write

jobs:
  patch-completion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ppt-generation-core-v0.7
          fetch-depth: 0
      - name: Patch workflow guard for v0.8 delivery evidence
        shell: python
        run: |
          from pathlib import Path
          path = Path("plugins/student-presentation-suite/scripts/workflow_guard.py")
          text = path.read_text(encoding="utf-8")

          old_profile = '''        if delivery.get("gate_profile") != "simplified-v1":
              errors.append("缺少 QA manifest 时必须使用 simplified-v1 交付报告。")
          '''
          new_profile = '''        core_version = delivery.get("generation_core_version")
          expected_profile = "simplified-v08" if core_version == "0.8" else "simplified-v1"
          if delivery.get("gate_profile") != expected_profile:
              errors.append(f"缺少 QA manifest 时 {core_version or 'unknown'} 必须使用 {expected_profile} 交付报告。")
          '''
          if old_profile not in text:
              raise SystemExit("profile block not found")
          text = text.replace(old_profile, new_profile, 1)

          old_version = '''        if delivery.get("generation_core_version") != "0.7.1":
              errors.append("当前 sp-deck 简化交付必须使用 generation_core_version=0.7.1。")
          '''
          new_version = '''        if core_version not in {"0.7.1", "0.8"}:
              errors.append("当前 sp-deck 简化交付必须使用 generation_core_version=0.7.1/0.8。")
          if core_version == "0.8":
              if delivery.get("visual_generation_check_passed") is not True:
                  errors.append("v0.8 visual generation evidence gate 未通过。")
              for hash_key, label in (
                  ("visual_generation_report_sha256", "visual generation report"),
                  ("art_direction_sha256", "Art Direction"),
              ):
                  value = delivery.get(hash_key)
                  if not isinstance(value, str) or len(value) != 64:
                      errors.append(f"v0.8 交付报告缺少有效的 {label} hash。")
          '''
          if old_version not in text:
              raise SystemExit("version block not found")
          text = text.replace(old_version, new_version, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit completion gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/student-presentation-suite/scripts/workflow_guard.py
          git commit -m "feat: require v0.8 visual generation evidence at complete"
          git push origin HEAD:improve/ppt-generation-core-v0.7
