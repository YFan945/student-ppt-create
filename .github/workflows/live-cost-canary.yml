name: live-cost-canary

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Real Claude canary scenario
        required: true
        default: deck-local
        type: choice
        options:
          - deck-local
          - deck-research
          - both
      model:
        description: Optional Claude model override (blank = account default)
        required: false
        default: ""
        type: string
      production_budget_usd:
        description: Optional per-scenario production-turn budget override; 0 uses scenario default
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  live-cost-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Require explicit live-test credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY repository secret is required for the manual live-cost canary." >&2
            exit 2
          fi

      - name: Install production and Claude Code dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          python -m pip install -r plugins/student-presentation-suite/requirements.txt -c plugins/student-presentation-suite/requirements-lock.txt
          python -m pip install -r plugins/student-presentation-suite/requirements-claude-pptx.txt -c plugins/student-presentation-suite/requirements-lock.txt
          npm --prefix plugins/student-presentation-suite ci
          npm install -g @anthropic-ai/claude-code@2.1.272

      - name: Run real sp-deck cost canary
        id: canary
        shell: bash
        run: |
          set -o pipefail
          args=(
            --plugin-dir plugins/student-presentation-suite
            --scenario "${{ inputs.scenario }}"
            --result-dir live-canary-results
            --json
          )
          if [ -n "${{ inputs.model }}" ]; then
            args+=(--model "${{ inputs.model }}")
          fi
          if [ "${{ inputs.production_budget_usd }}" != "0" ]; then
            args+=(--production-budget-usd "${{ inputs.production_budget_usd }}")
          fi
          python plugins/student-presentation-suite/scripts/live_cost_canary.py "${args[@]}" | tee live-canary-summary.json

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cost-canary-${{ inputs.scenario }}-${{ github.run_id }}
          path: |
            live-canary-results/
            live-canary-summary.json
          if-no-files-found: warn
          retention-days: 30
