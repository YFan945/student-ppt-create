name: unittest

# Pull requests only. Pushes do not run this workflow, and it is not a
# required release status check. The job is the existing unittest suite with
# python-constraints.txt.

on:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/student-presentation-suite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install constrained Python dependencies
        run: |
          python -m pip install -r requirements.txt -c python-constraints.txt
          python -m pip install -r requirements-claude-pptx.txt -c python-constraints.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests
