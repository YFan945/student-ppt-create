name: v071-fixups

on:
  push:
    branches: [improve/ppt-generation-core-v0.7]

permissions:
  contents: write

jobs:
  fixups:
    if: github.event.head_commit.message != 'chore apply v071 fixups'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ppt-generation-core-v0.7
      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quality = Path('plugins/student-presentation-suite/skills/sp-deck/scripts/pptx_quality_gate_v071.py')
          text = quality.read_text(encoding='utf-8')
          text = text.replace('    structures: list[str] = []\n', '')
          text = text.replace('        structures.append(structure)\n', '')
          old = '''    # Classroom decks often combine conclusion + references on the final page.\n    if actual_text:\n        reference_indices.update(range(max(1, len(actual_text) - 1), len(actual_text) + 1))\n'''
          new = '''    # Classroom decks often combine conclusion + references on the final page.\n    # Do not include the penultimate slide automatically: a short source line on\n    # a content slide is not a substitute for the final bibliography.\n    if actual_text:\n        reference_indices.add(len(actual_text))\n'''
          if old not in text:
              raise SystemExit('expected evidence reference-area block not found')
          quality.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('plugins/student-presentation-suite/tests/test_generation_core_v071.py')
          test_text = tests.read_text(encoding='utf-8')
          if '"这是测试讲稿。" * 35' not in test_text:
              raise SystemExit('expected timing fixture not found')
          tests.write_text(test_text.replace('"这是测试讲稿。" * 35', '"这是测试讲稿。" * 60'), encoding='utf-8')
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/student-presentation-suite/skills/sp-deck/scripts/pptx_quality_gate_v071.py plugins/student-presentation-suite/tests/test_generation_core_v071.py
          if ! git diff --cached --quiet; then
            git commit -m "chore apply v071 fixups"
            git push origin HEAD:improve/ppt-generation-core-v0.7
          fi
