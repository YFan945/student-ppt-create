version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/plugins/student-presentation-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # markitdown 0.1.x pins magika~=0.6.1, so magika 1.x is uninstallable
      # until markitdown updates its pin. Revisit then.
      - dependency-name: "magika"
        versions: [">=1"]
      # mpmath is a transitive pin of sympy in requirements-lock.txt; sympy
      # 1.14 requires mpmath<1.4. Revisit when sympy allows mpmath 1.4.
      - dependency-name: "mpmath"
        versions: [">=1.4"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/plugins/student-presentation-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # Repo still uses .eslintrc format; eslint >=9 requires a flat-config
      # migration, which is its own task. Revisit after that migration.
      - dependency-name: "eslint"
        versions: [">=9"]
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
