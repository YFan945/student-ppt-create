version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/plugins/student-presentation-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/plugins/student-presentation-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # Repo still uses .eslintrc format; eslint >=9 requires a flat-config
      # migration, which is its own task. Revisit after that migration.
      - dependency-name: "eslint"
        versions: [">=9"]
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
