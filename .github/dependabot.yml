version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/plugins/student-presentation-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    # python-constraints.txt (the resolved transitive pin set, consumed via
    # `pip install -c`) is deliberately NOT named requirements*.txt so it
    # stays outside Dependabot's file discovery: independent bumps of
    # transitive pins broke sibling constraints four times on 2026-09-26
    # (magika, mpmath, numpy, onnxruntime). Regenerate that file manually
    # after manifest range upgrades, covering py3.11/3.12 on linux+windows.
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/plugins/student-presentation-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # Repo still uses .eslintrc format; eslint >=9 requires a flat-config
      # migration, which is its own task. Revisit after that migration.
      - dependency-name: "eslint"
        versions: [">=9"]
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
