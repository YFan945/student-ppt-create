slides:
- id: 1
  title: AI 会「编」，而且编得很自信
  layout: cover-editorial
  layout_lock: false
  role: opening
  kind: cover
  claim: AI 会「编」，而且编得很自信
  content:
  - 副标题：从语言模型的训练目标理解「幻觉」
  speaker_notes: 开场先制造一个反差。模型可以在几秒内写出结构完整、语气自信的答案，但这并不等于它说的对。今天这场汇报只回答一件事：它为什么会编，以及我们能做什么。请记住封面这句话，后面每个结论都会回到它。
  key_line: 流畅 ≠ 正确
  timing_sec: 30
  owner: Individual
  visual:
    type: typographic
    purpose: 用超大标题建立全篇论点，而不是放一张无关封面图。
    emphasis: text
- id: 2
  title: 为什么一个模型能立刻给出流畅的答案？
  layout: claim-focus
  layout_lock: false
  role: problem
  kind: content
  claim: 因为它先学会的是预测下一个最可能的词，而不是先查证事实。
  supporting_points:
  - 流畅 ≠ 正确
  - 自信 ≠ 有据
  content:
  - 核心命题：它先学会预测下一个词，而不是先查证事实
  speaker_notes: 把问题收敛成一个机制判断。模型训练时优化的目标是预测下一个最可能出现的词，而不是先查证事实。这两件事在统计上高度相关，所以答案往往很流畅；但它们并不是同一件事。流畅、自信、完整，都可以在没有事实依据的情况下被生成出来。这就是今天讨论的起点。
  key_line: 它先学会的是预测下一个最可能的词
  evidence_refs:
  - E1
  timing_sec: 38
  owner: Individual
  visual:
    type: typographic
    purpose: 用文字对比承担核心命题，不塞图。
    emphasis: text
- id: 3
  title: 幻觉不是偶发 bug
  layout: section-number
  layout_lock: false
  role: background
  kind: section-divider
  claim: 幻觉不是偶发 bug
  content:
  - 章节引导：从训练目标进入
  speaker_notes: 这里做一个呼吸和定位。我要强调一个判断：幻觉不是偶发的程序故障，而是训练方式本身的产物。既然是产物，就不能指望它偶然消失，只能从流程上用别的手段去补。
  key_line: 它不是 bug，是产物
  timing_sec: 18
  owner: Individual
- id: 4
  title: 三类因素在放大「合理但未核实」
  layout: architecture-layered
  layout_lock: false
  role: method
  kind: content
  claim: 都在放大同一种失败模式：输出「合理但未核实」
  supporting_points:
  - 训练目标：最大化似然
  - 数据噪声：真假混杂
  - 知识边界：不知道就猜
  content:
  - 三个从属因素汇聚到一个主导结论：输出合理但未核实
  speaker_notes: 这一页是整场汇报的机制核心。三个因素共同作用：训练目标鼓励最大化似然，所以更像人话的答案得分更高；训练数据里真假混杂，模型无法区分来源可靠性；知识边界之外它没有停下来的机制，只能继续猜。请先记住下面这个结论：三者并没有各自独立的问题，而是共同放大同一种失败模式，输出合理但未核实的内容。
  key_line: 都在放大「合理但未核实」
  evidence_refs:
  - E1
  timing_sec: 45
  owner: Individual
  visual:
    type: architecture
    purpose: 用收敛结构表达多因一果，避免三等分卡片。
    layout_family: architecture
    emphasis: visual
    details:
      nodes:
      - 训练目标：最大化似然
      - 数据噪声：真假混杂
      - 知识边界：不知道就猜
- id: 5
  title: 示意数据：流畅的摘要有多少不忠实
  layout: data-chart-takeaway
  layout_lock: false
  role: evidence
  kind: content
  claim: 约三成摘要与原文不一致
  supporting_points:
