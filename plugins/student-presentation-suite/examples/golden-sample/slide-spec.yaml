- id: 6
  title: 案例：一条检索不到的「文献」
  layout: visual-annotated
  layout_lock: false
  role: evidence
  kind: content
  claim: 格式自洽，却检索不到
  supporting_points:
  - 作者与年份格式自洽
  - 期刊名真实存在
  - 组合后检索不到
  content:
  - 示例引用（虚构）与三条标注
  speaker_notes: 这个案例说明危险点在哪里。模型给出的这条引用，作者和年份格式自洽，期刊名也真实存在，但把它当成一个整体去检索，却是找不到的。也就是说，每个局部都合理，组合起来才失效。这正是人工快速核对容易放过它的原因。所以核对不能只看格式，要看整体是否可溯源。
  key_line: 格式自洽 ≠ 真实存在
  evidence_refs:
  - E1
  timing_sec: 40
  owner: Individual
  visual:
    type: typographic_evidence
    purpose: 用排版化的引用证据替代虚构照片。
    emphasis: balanced
- id: 7
  title: 降低幻觉：先取证，再回答
  layout: compare-criteria
  layout_lock: false
  role: solution
  kind: content
  claim: 把查证写进流程
  supporting_points:
  - 仅提示「不要编」：零成本、效果不稳定
  - 先检索再回答（RAG）：引用可核验、补足知识边界
  content:
  - 推荐方案与对照方案的不对称对比
  speaker_notes: 这一页不是二选一，而是说明两种做法的性质不同。左边只是提示模型不要编，成本接近零，但没有改变它的信息条件，所以效果不稳定。右边是先检索再回答，把外部材料放进上下文，让引用可以核验，也补上了知识边界。视觉上我刻意让推荐方案占更大的权重，因为它们的结论并不等权。
  key_line: 先取证，再回答
  evidence_refs:
  - E1
  timing_sec: 42
  owner: Individual
  visual:
    type: comparison
    purpose: 不对称对比，首选方案占主导权重。
    layout_family: comparison
    emphasis: balanced
    details:
      dimensions:
      - 成本
      - 可核验性
      - 对知识边界的覆盖
      items:
      - 仅提示「不要编」
      - 先检索再回答（RAG）
- id: 8
  title: 回到这条推理链
  layout: process-horizontal
  layout_lock: false
  role: conclusion
  kind: content
  claim: 先取证，再回答
  supporting_points:
  - 幻觉源于优化目标
  - 流畅不等于忠实
  - 先取证，再回答
  content:
  - 三步回顾，第三步为结论并加权重
  speaker_notes: 最后把论证顺序复述一遍。第一步，幻觉来自优化目标；第二步，流畅不等于忠实；第三步，所以对策是把查证放进流程。请注意这三步是有先后关系的推理链，不是三个并列的要点。落点只有一个：先取证，再回答。
  key_line: 先取证，再回答
  evidence_refs:
  - E1
  timing_sec: 30
  owner: Individual
  visual:
    type: process
    purpose: 用带强调终点的路径强化论证顺序。
    layout_family: process-path
    emphasis: balanced
    details:
      steps:
      - 幻觉源于优化目标
      - 流畅不等于忠实
      - 先取证，再回答
- id: 9
  title: 流畅是能力，忠实是选择。
  layout: closing-takeaway
  layout_lock: false
  role: closing
  kind: closing
  claim: 流畅是能力，忠实是选择。
  content:
  - 结语呼应封面论点
  speaker_notes: 收束成一句话：流畅是一种能力，忠实是一种选择。我们无法要求模型凭自觉变得诚实，但可以在流程里强制它先取证。谢谢大家，下面是提问时间。
  key_line: 流畅是能力，忠实是选择。
  timing_sec: 22
  owner: Individual
  visual:
    type: typographic
    purpose: 用呼应收尾，避免「谢谢观看」式结尾。
    emphasis: text
