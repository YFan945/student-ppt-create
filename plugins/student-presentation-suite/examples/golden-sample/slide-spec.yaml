  - 图表只承担证据角色
  content:
  - 示意数据：完全忠实 68 / 部分不忠实 22 / 明显不忠实 10
  speaker_notes: 这一页演示证据页应该怎么读。我要先说清楚：这是课堂示意数据，不是任何一篇论文的统计结果，用来说明结构和读法。正确顺序是先读左侧结论，再看右侧图表作证据。图表的职责是支撑一句话，而不是把每一个数字都展示出来。真实汇报时请替换成有出处的数据。
  key_line: 约三成摘要与原文不一致
  evidence_refs:
  - E2
  timing_sec: 38
  owner: Individual
